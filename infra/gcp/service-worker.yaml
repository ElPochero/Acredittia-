apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: acredittia-worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      serviceAccountName: ${GCP_WORKER_SA_EMAIL}
      containers:
        - image: ${GCP_IMAGE}
          command: ["celery"]
          args: ["-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          env:
            - name: APP_ENV
              value: production
            - name: CLOUD_PROVIDER
              value: gcp
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: STORAGE_BACKEND
              value: gcp
            - name: GCP_STORAGE_BUCKET
              value: "${GCP_STORAGE_BUCKET}"
            - name: JWE_BACKEND
              value: gcp
            - name: GCP_KMS_KEY_NAME
              value: "${GCP_KMS_KEY_NAME}"
            - name: SECRET_BACKEND
              value: gcp
            - name: QUEUE_BACKEND
              value: celery
            - name: REDIS_URL
              value: "${REDIS_URL}"
            - name: DATABASE_URL
              value: "${WORKER_DATABASE_URL}"
            - name: JWT_SECRET
              value: "${JWT_SECRET}"
            - name: SCHEMA_DIR
              value: /schema
          resources:
            limits:
              cpu: "1000m"
              memory: 1Gi
